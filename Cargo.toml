[package]
name = "burnrate"
version = "0.1.14"
edition = "2024"
# Inherited from the claudex dependency; cargo turns this into a clear error
# (instead of a confusing build failure) on older toolchains.
rust-version = "1.95"
description = "Desktop usage monitor for Claude Code, Codex, GitHub Copilot, OpenRouter, Runpod, and AWS quotas, credits, spend, and subscription limits, with claudex-powered local usage insights."
license = "MIT"
repository = "https://github.com/jamesbrink/burnrate"
homepage = "https://jamesbrink.online/burnrate/"
readme = "README.md"
keywords = ["usage", "quota", "claude", "codex", "copilot"]
categories = ["command-line-utilities", "gui"]
include = [
  "src/**",
  "dist/**",
  ".cargo/config.toml",
  "Cargo.toml",
  "Cargo.lock",
  "build.rs",
  "tauri.conf.json",
  "entitlements.macos.plist",
  "capabilities/**",
  "gen/**",
  "icons/**",
  "README.md",
  "LICENSE",
]

# `custom-protocol` switches Tauri from the dev server (devUrl) to the embedded
# `dist/` assets. The `tauri` CLI enables it automatically for `tauri build`, but
# plain `cargo build --release` and `cargo install burnrate` do not — so it must
# be on by default, or those binaries load http://localhost:5173 and render blank.
# `tauri dev` opts back out via `--no-default-features` to keep live reload.
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
anyhow = "1"
aws-config = "=1.5.18"
aws-sdk-costexplorer = { version = "=1.100.0", default-features = false, features = [
  "rt-tokio",
  "rustls",
] }
aws-sdk-sts = { version = "=1.80.0", default-features = false, features = [
  "rt-tokio",
  "rustls",
] }
aws-types = "=1.3.11"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
# claudex pins rusqlite 0.39 internally; the rusqlite pin below must move in
# lockstep with claudex's, or cargo fails on the libsqlite3-sys links conflict.
claudex = "0.11"
dirs = "6"
keyring = { version = "3", features = [
  "apple-native",
  "windows-native",
  "sync-secret-service",
] }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
rusqlite = { version = "=0.39.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [
  "image-png",
  "macos-private-api",
  "tray-icon",
] }
tauri-plugin-updater = "2"
thiserror = "2"
tokio = { version = "1", features = [
  "io-util",
  "macros",
  "process",
  "rt-multi-thread",
  "time",
] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

# Runtime Dock icon for the unbundled binary (see src/tray.rs). The objc2 stack
# already ships transitively via tao/wry at these versions; enabling the NSImage
# feature pulls in one small extra crate (objc2-core-video). `window-vibrancy`
# (already in Cargo.lock via Tauri) gives the tray popover its native
# NSVisualEffectView material + rounded corners.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
  "NSApplication",
  "NSImage",
  "NSAlert",
  "NSRunningApplication",
] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSString"] }
# macOS-only on purpose: the updater (the lone notification source) requires a
# bundled macOS app, and on Linux notify-rust would drag in a dbus build dep.
tauri-plugin-notification = "2"
window-vibrancy = "0.6"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
