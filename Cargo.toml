[package]
name = "burnrate"
version = "0.1.0"
edition = "2024"
description = "Tray-first desktop quota and burn-rate monitor for Claude Code, Codex, and OpenRouter."
license = "MIT"
repository = "https://github.com/jamesbrink/burnrate"
homepage = "https://github.com/jamesbrink/burnrate"
readme = "README.md"
keywords = ["tauri", "usage", "quota", "claude", "codex"]
categories = ["command-line-utilities", "gui"]
include = [
  "src/**",
  "dist/**",
  "Cargo.toml",
  "Cargo.lock",
  "build.rs",
  "tauri.conf.json",
  "capabilities/**",
  "gen/**",
  "icons/**",
  "README.md",
  "LICENSE",
]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
keyring = { version = "3", features = [
  "apple-native",
  "windows-native",
  "sync-secret-service",
] }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["image-png", "tray-icon"] }
thiserror = "2"
tokio = { version = "1", features = [
  "io-util",
  "macros",
  "process",
  "rt-multi-thread",
  "time",
] }
uuid = { version = "1", features = ["v4", "serde"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
