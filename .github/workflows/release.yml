name: Native Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Ensure macOS universal Rust targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS Developer ID signing + notarization. Scoped to the macOS leg
          # (empty string on the Linux/Windows runners) so the signing secrets
          # are never exposed off-target. tauri-action imports the cert into a
          # temporary keychain and notarizes when these are present.
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
          # Tauri updater signing. `createUpdaterArtifacts: true` makes every
          # leg sign its updater bundle, so the key must be present on all
          # runners or the build fails. Only the macOS manifest is published
          # (see the publish-manifest job); other legs' artifacts go unused.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}
          # The signed latest.json is built centrally by publish-manifest to
          # avoid a parallel-upload race across the matrix legs.
          includeUpdaterJson: false
      - name: Generate checksums
        if: matrix.platform != 'windows-latest'
        run: |
          find target -path "*/bundle/*" -type f \( -name "*.dmg" -o -name "*.app.tar.gz" -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \) -print0 \
            | sort -z \
            | xargs -0 shasum -a 256 > "burnrate-${{ matrix.platform }}.sha256"
      - name: Generate Windows checksums
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          Get-ChildItem -Path target -Recurse -File | Where-Object { $_.FullName -match '\\bundle\\' -and ($_.Extension -in '.msi','.exe') } | ForEach-Object {
            $hash = Get-FileHash -Algorithm SHA256 $_.FullName
            "$($hash.Hash.ToLower())  $($_.FullName)"
          } | Set-Content "burnrate-${{ matrix.platform }}.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            burnrate-${{ matrix.platform }}.sha256
            target/**/bundle/**/*.dmg
            target/**/bundle/**/*.app.tar.gz
            target/**/bundle/**/*.app.tar.gz.sig
            target/**/bundle/**/*.deb
            target/**/bundle/**/*.rpm
            target/**/bundle/**/*.AppImage
            target/**/bundle/**/*.msi
            target/**/bundle/**/*.exe

  # Build the signed updater manifest once, from the macOS universal bundle's
  # signature, and attach it to the release. The in-app updater fetches it at
  # releases/latest/download/latest.json. Tag pushes only — workflow_dispatch
  # has no tag to key the asset URLs on.
  publish-manifest:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          mkdir -p release-sigs
          # The release was just populated by the build legs; retry briefly in
          # case asset propagation lags the job hand-off.
          for attempt in 1 2 3; do
            rm -f release-sigs/*.sig
            if gh release download "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "*.app.tar.gz.sig" \
              --dir release-sigs \
              --clobber; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::no macOS *.app.tar.gz.sig on release $TAG after 3 attempts"
              exit 1
            fi
            echo ".sig fetch attempt $attempt failed; retrying in $((attempt * 5))s"
            sleep $((attempt * 5))
          done

          scripts/build-updater-manifest.sh \
            release-sigs \
            "${TAG#v}" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}" \
            > latest.json
          cat latest.json

          gh release upload "$TAG" latest.json --clobber --repo "$GITHUB_REPOSITORY"

          # Smoke test the contract the in-app updater relies on.
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/latest.json"
          for attempt in 1 2 3 4 5; do
            http=$(curl -sIL -o /dev/null -w "%{http_code}" "$URL" || echo "000")
            [ "$http" = "200" ] && { echo "latest.json reachable (HTTP 200)"; break; }
            if [ "$attempt" -eq 5 ]; then
              echo "::error::latest.json at $URL returned HTTP $http"
              exit 1
            fi
            echo "latest.json HTTP $http (attempt $attempt); retrying in 10s"
            sleep 10
          done
