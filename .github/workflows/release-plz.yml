name: release-plz

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-plz:
    runs-on: ubuntu-latest
    steps:
      # Mint a GitHub App token so the release PR and version tag are authored
      # by the app instead of github-actions[bot]. GitHub's recursion guard
      # suppresses workflow runs triggered by GITHUB_TOKEN/bot identities, which
      # otherwise leaves the release PR with no CI (required checks never report,
      # so the merge is blocked) and the version tag not triggering release.yml.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # release-plz runs `cargo publish --verify`, which builds the crate on this
      # Linux runner — so it needs the same Tauri GTK/WebKit system libraries the
      # other workflows install, or the build fails on `glib-sys`.
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - run: npm ci
      - run: npm run build
      - name: Verify bundled frontend assets are committed
        run: git diff --exit-code -- dist
      - name: Remove frontend install artifacts
        run: rm -rf node_modules
      - uses: release-plz/action@v0.5
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
